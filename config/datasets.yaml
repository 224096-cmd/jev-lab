# =====================================================================
# 情報収集（OSINT）向け family
# =====================================================================

  claim_check_ja:
    desc: 根拠文に照らして主張が支持されるか（JNLI を OSINT の「根拠×主張」形式に組み替え）
    license: CC BY-SA 4.0（JGLUE）
    source: {kind: hf, repo: shunk031/JGLUE, config: JNLI, splits: {train: train, val: validation, test: validation}}
    val_test_split: 0.5
    state: "主張: {sentence2}"
    context_from: [sentence1]          # context として注入（RAG 相当）
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: verdict
        type: choice
        instructions: ["根拠に照らして、この主張はどう判定されるか"]
        ood_instructions: ["この主張は根拠から裏付けられるか、否定されるか、判断できないか"]
        options: [支持される, 否定される, 判断できない]
        gold: label
        label_map: {0: 支持される, 1: 否定される, 2: 判断できない}
      - id: supported
        type: noul
        instructions: ["根拠（context）の内容と整合しているか"]
        ood_instructions: ["根拠と食い違っているか"]
        ood_negated: true
        gold: label
        label_map: {0: "yes", 1: "no", 2: "no"}

  fever_en:
    desc: 事実検証（英語）。Wikipedia の根拠文と主張 → 支持/否定/情報不足。open-jev・GLiNER2 等の英語 Jev モデル比較用
    license: CC BY-SA 3.0（FEVER）
    source: {kind: hf, repo: copenlu/fever_gold_evidence, config: default, splits: {train: train, val: validation, test: test}}
    state: "Claim: {claim}"
    context_from_evidence: evidence     # [page, sent_id, text] の text を context に
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: verdict
        type: choice
        instructions: ["Given the evidence, how is the claim judged?"]
        ood_instructions: ["Does the evidence support, refute, or fail to decide the claim?"]
        options: [supported, refuted, not enough info]
        gold: label
        label_map: {SUPPORTS: supported, REFUTES: refuted, "NOT ENOUGH INFO": not enough info}
      - id: supported
        type: noul
        instructions: ["Is the claim consistent with the evidence?"]
        ood_instructions: ["Does the evidence contradict the claim?"]
        ood_negated: true
        gold: label
        label_map: {SUPPORTS: "yes", REFUTES: "no", "NOT ENOUGH INFO": "no"}

  tweet_sentiment_en:
    desc: SNS 投稿の感情（英語、3 段階 Score）
    license: TweetEval（研究利用）
    source: {kind: hf, repo: tweet_eval, config: sentiment, splits: {train: train, val: validation, test: test}}
    state: "{text}"
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: sentiment
        type: score
        instructions: ["What is the sentiment of this post?"]
        ood_instructions: ["How positive is the writer's tone?"]
        levels: [negative, neutral, positive]
        gold: label
        label_map: {0: negative, 1: neutral, 2: positive}

  fast_decisions_en:
    desc: GLiNER2.5-Decide の公式ベンチ（英語、17 ドメイン、1 入力に複数タスク）。既存 Jev 級モデルとの直接比較用
    license: Apache 2.0（fastino/fast-decisions）
    source: {kind: fast_decisions, repo: fastino/fast-decisions, configs: [news_topic, email_triage, support_intent, ticket_route, review_sentiment, document_type, agent_handoff, product_feedback], splits: {train: 0.6, val: 0.1, test: 0.3}}
    limit: {train: 1200, val: 150, test: 300}
