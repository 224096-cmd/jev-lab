# JevBench-JA データ定義
# 公開日本語データセット（gold ラベル付き）を「state + 型付き質問」に変換する規則。
# 1 family = 1 データセット × 1 質問。ここに追記すれば build.py が自動で取り込む。
#
# 共通キー
#   source:      hf   … HF Hub の parquet（repo, config, split 名）
#                csv  … 手元の CSV/TSV（path, 列名）
#   state:       state を作るテンプレ。{列名} が置換される
#   questions:   この family で発行する質問（複数可）。gold は列名か、{列名} から label_map で写像
#     type:      choice | score | noul
#     instructions: 質問文。リスト可（学習時にランダム選択＝言い換え拡張、ood_instructions は評価専用）
#     options / levels: 選択肢（choice/score）。label_map で元ラベル→選択肢名
#   limit:       各 split の最大件数（CPU でも回る規模に）
#   license:     卒論の付録に載せるため必ず書く

families:

  livedoor_topic:
    desc: ニュース記事（本文冒頭）のカテゴリ 9 択
    license: CC BY-ND 2.1 JP（ロンウイット）／再配布せず HF から取得
    source: {kind: hf, repo: sbintuitions/JMTEB, config: livedoor_news, splits: {train: train, val: validation, test: test}}
    state: "{title}\n{text}"
    state_max_chars: 300
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: topic
        type: choice
        instructions: ["この記事のカテゴリはどれか", "記事が属する媒体・分野を選べ"]
        ood_instructions: ["次の文章はどのニュースサイトに掲載されたものか"]
        options: [トピックニュース, スポーツ, 映画, 家電・IT, ライフハック, 女性向け, 独身男性向け, エンタメ, モバイル]
        gold: label
        label_map: {0: 家電・IT, 1: スポーツ, 2: 独身男性向け, 3: ライフハック, 4: 映画, 5: エンタメ, 6: 女性向け, 7: トピックニュース, 8: モバイル}

  jnli:
    desc: 前提と仮説の含意関係（3 択）＋ Noul
    license: CC BY-SA 4.0（JGLUE, Yahoo Japan）
    source: {kind: hf, repo: shunk031/JGLUE, config: JNLI, splits: {train: train, val: validation, test: validation}}
    val_test_split: 0.5          # validation を val/test に半分ずつ
    state: "前提: {sentence1}\n仮説: {sentence2}"
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: nli
        type: choice
        instructions: ["前提に対して仮説はどの関係か", "前提が真のとき、仮説は成り立つか・矛盾するか・どちらとも言えないか"]
        ood_instructions: ["仮説は前提から導けるか、前提と食い違うか、無関係か"]
        options: [含意, 矛盾, 中立]
        gold: label
        label_map: {0: 含意, 1: 矛盾, 2: 中立}
      - id: entails
        type: noul
        instructions: ["前提が真ならば仮説も必ず真と言えるか"]
        ood_instructions: ["前提から仮説が導けないと言えるか"]     # 否定形 → gold 反転
        ood_negated: true
        gold: label
        label_map: {0: yes, 1: no, 2: no}

  jsts:
    desc: 2 文の意味的類似度（0〜5 → 6 段階 Score）
    license: CC BY-SA 4.0（JGLUE）
    source: {kind: hf, repo: shunk031/JGLUE, config: JSTS, splits: {train: train, val: validation, test: validation}}
    val_test_split: 0.5
    state: "文A: {sentence1}\n文B: {sentence2}"
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: similarity
        type: score
        instructions: ["文A と文B の意味はどのくらい似ているか", "2 文が同じ内容を述べている度合い"]
        ood_instructions: ["2 文の意味の隔たりはどのくらい小さいか"]
        levels: ["0 無関係", "1", "2", "3", "4", "5 同じ意味"]
        gold: label
        gold_round: true          # 連続値を四捨五入して段階に

  jcqa:
    desc: 常識推論の 5 択（文脈なし）
    license: CC BY-SA 4.0（JGLUE）
    source: {kind: hf, repo: shunk031/JGLUE, config: JCommonsenseQA, splits: {train: train, val: validation, test: validation}}
    val_test_split: 0.5
    state: "{question}"
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: answer
        type: choice
        instructions: ["質問の答えとして最も適切なものはどれか"]
        ood_instructions: ["常識的に考えて正しい選択肢を選べ"]
        options_from: [choice0, choice1, choice2, choice3, choice4]   # 行ごとに選択肢が異なる
        gold: label
        gold_is_index: true

  wrime_sentiment:
    desc: SNS 投稿の感情極性（書き手評価 -2〜2 → 5 段階 Score）
    license: 研究目的（WRIME, 東北大・ids-cv）
    source: {kind: hf, repo: shunk031/wrime, config: ver2, splits: {train: train, val: validation, test: test}}
    state: "{sentence}"
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: polarity
        type: score
        instructions: ["この投稿の書き手の感情はどれか", "投稿全体の感情の向き"]
        ood_instructions: ["書き手はどのくらい前向きな気持ちか"]
        levels: [強い否定, 否定, 中立, 肯定, 強い肯定]
        gold: writer.sentiment
        label_map: {-2: 強い否定, -1: 否定, 0: 中立, 1: 肯定, 2: 強い肯定}
      - id: joy
        type: noul
        instructions: ["書き手は喜びを感じているか"]
        ood_instructions: ["書き手は喜びを感じていないと言えるか"]
        ood_negated: true
        gold: writer.joy
        gold_threshold: 1          # >=1 で yes

  jcola:
    desc: 日本語文の文法的容認性（Noul）
    license: CC BY-SA 4.0（JCoLA）
    source: {kind: hf, repo: shunk031/JGLUE, config: JCoLA, splits: {train: train, val: validation, test: validation_out_of_domain}}
    state: "{sentence}"
    limit: {train: 1200, val: 150, test: 300}
    questions:
      - id: acceptable
        type: noul
        instructions: ["この文は日本語として自然で文法的に正しいか"]
        ood_instructions: ["この文は文法的に不自然か"]
        ood_negated: true
        gold: label
        label_map: {0: "no", 1: "yes"}

