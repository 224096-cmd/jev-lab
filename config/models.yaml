# JEV Lab モデル設定
# VS Code で編集して切替。HF id・アダプタ種別・デバイスだけ変えれば同じ IF で比較できる。
# device: "cuda" (RTX 3060) / "cpu" / "auto"

default: jev_ja_30m

models:

  # ---- Jev 級・参照実装（英語）--------------------------------------------
  open_jev_deberta:
    adapter: open_jev
    hf_id: com-kotobalabs/open-jev-deberta-v3-large   # Apache-2.0, 435M
    device: auto
    language: en
    note: Kotoba Labs の Jev 形再現。span-pool head, CE+Brier, 温度は同梱 config

  # ---- 隣接クラス・分類ヘッド（ラベル集合を実行時に渡す）-------------------
  gliner2_decide:
    adapter: gliner2
    hf_id: fastino/GLiNER2.5-Decide        # Apache-2.0, 340M, English
    device: auto
    language: en
    normalize: softmax_over_scores          # 多ラベル score を分布に直す方法（較正値を左右する）
  gliner2_multi:
    adapter: gliner2
    hf_id: fastino/GLiNER2.5-multi-Decide  # Apache-2.0, 287M, multilingual
    device: auto
    language: multi
    normalize: softmax_over_scores

  # ---- ゼロショット NLI ベースライン（学習なし）-----------------------------
  nli_mdeberta:
    adapter: nli_zeroshot
    hf_id: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7  # MIT, 278M
    device: auto
    language: multi
    hypothesis_template: "この文の答えは「{}」である。"

  # ---- LLM に確率を書かせる方式（verbalized）------------------------------
  llm_qwen3_0_6b:
    adapter: llm_verbalized
    hf_id: Qwen/Qwen3-0.6B                 # Apache-2.0
    device: auto
    language: multi
    max_new_tokens: 256
    enable_thinking: false
  llm_qwen3_1_7b:
    adapter: llm_verbalized
    hf_id: Qwen/Qwen3-1.7B
    device: auto
    language: multi
    max_new_tokens: 256
    enable_thinking: false

  # ---- 独自 JEV-JA（本命・卒論成果物）--------------------------------------
  jev_ja_30m:
    adapter: jev_ja
    backbone: sbintuitions/modernbert-ja-30m   # MIT, 37M。ruri-v3-30m (Apache) でも可
    head_path: checkpoints/jev_ja_30m          # 学習後に生成。無ければ未学習ヘッドで動く
    pool: span            # span = option/instr の text token 平均（Kotoba で効いた方式）
                          # marker = [OPT] marker の hidden state（学習しないことが報告済み。比較用）
    max_length: 1024
    device: auto
    language: ja
  jev_ja_30m_cos:                                # ゼロショット基準（同じエンコーダ、ヘッドなし）
    adapter: jev_ja
    backbone: sbintuitions/modernbert-ja-30m
    head_path: checkpoints/jev_ja_30m            # 学習後のエンコーダがあればそれを使う（無ければ素の事前学習）
    method: cos
    cos_scale: 20
    pool: span
    max_length: 1024
    device: auto
    language: ja
  jev_ja_70m:
    adapter: jev_ja
    backbone: sbintuitions/modernbert-ja-70m
    head_path: checkpoints/jev_ja_70m
    pool: span
    max_length: 1024
    device: auto
    language: ja
  jev_ja_ruri30m:
    adapter: jev_ja
    backbone: cl-nagoya/ruri-v3-pt-30m         # Apache-2.0 事前学習版（fine-tune 前）
    head_path: checkpoints/jev_ja_ruri30m
    pool: span
    max_length: 1024
    device: auto
    language: ja
  jev_ja_deberta_large:
    adapter: jev_ja
    backbone: globis-university/deberta-v3-japanese-large   # ライセンス要確認（CC-BY-SA 系）
    head_path: checkpoints/jev_ja_deberta_large
    pool: span
    max_length: 512
    device: cuda
    language: ja
    note: Kotoba の「DeBERTa-large が最良」を日本語で検証する用。PC/LAN 専用

  # ---- 既存の Jev 級モデル（HF、PC で実行）----------------------------------------
  argos_ja_310m:                                  # 日本語 Jev cross-encoder（検証精度 0.90、CC BY-SA 4.0）
    adapter: crossenc_hf
    hf_id: argos1111/modernbert-ja-310m-jev
    prompt: "質問: {question}\n状況: {state}"
    noul_options: ["true", "false"]
    max_length: 512
    device: auto
    language: ja
  openjev_base:                                   # open-jev-base（mmBERT-small 140M、Jev 1.13 を教師に蒸留、en/ru、MIT）。決定文が先・本文が後、sigmoid を K で正規化
    adapter: crossenc_hf
    hf_id: sshalimov04/open-jev-base
    subfolder: student
    prompt: "A: {type} | Q: {question} | option: {option} | options: {options}"
    pair_order: decision_first
    score: sigmoid
    noul_options: ["yes", "no"]
    max_length: 512
    device: auto
    language: multi
  tiny_jev_0_6b:                                  # Qwen3-0.6B ベース、英語（Apache-2.0）
    adapter: tiny_jev
    hf_id: lostargon/Tiny-Jev
    device: auto
    language: en
  jev_style_0_8b:                                 # Qwen3.5-0.8B ベース、多言語（日本語含む、Apache-2.0）。pip install "jev-style[torch]"
    adapter: jev_style
    hf_id: chaoliangUNSW/Jev-Style-0.8B-Decision-v3
    device: auto
    language: multi
  laya_multi_322m:                                # Laya multilingual（mmBERT-base 322M、100+ 言語、Apache-2.0、HF ❤ 3.8k の Laya 系）pip install laya
    adapter: laya
    hf_id: convaiinnovations/laya-multilingual
    language: multi
    note: "[MASK] 位置の 1 logit を選択肢ごとに読む。context 1024。ブラウザ版は export_laya.py"
  jevlet_33m:                                     # Jevlet v6（bge-small 33.5M、英語、MIT）。自作 30m と同規模の既存 Jev。pip install git+https://github.com/NAME0x0/Jevlet
    adapter: jevlet
    hf_id: NAME0x0/Jevlet
    language: en
  laya_en_421m:                                   # Laya 英語（ModernBERT-large 421M）
    adapter: laya
    hf_id: convaiinnovations/laya
    language: en
  laya_typed_decisions:                           # typed-decisions ベンチ特化（acc 0.766、Jev 1.13 の 0.727 を上回る）
    adapter: laya
    hf_id: convaiinnovations/laya-typed-decisions
    language: en
  # open-jev-deberta-v3-large は open_jev_deberta（上）。

  # ---- 既存の小型 Jev 級モデルの改良ルート ----------------------------------
  # (a) 多言語 DeBERTa をバックボーンに JEV-JA ヘッドを載せる（Kotoba の「DeBERTa が最良」を多言語で）
  jev_ja_mdeberta_base:
    adapter: jev_ja
    backbone: microsoft/mdeberta-v3-base       # MIT, 278M, 多言語（日本語・英語の family を同時に学習可）
    head_path: checkpoints/jev_ja_mdeberta_base
    pool: span
    max_length: 512
    device: cuda
    language: multi
    note: RTX 3060 で bf16・grad-accum 16 なら学習可。端末には載せない（PC 比較用）
  # (b) GLiNER2.5-multi-Decide（287M, Apache）を JevBench-JA で追加学習する場合:
  #     python -m jev_lab.train.convert_gliner2 → data/gliner2/*.json を作り、gliner2 のトレーナで学習。
  #     学習後は gliner2_multi の hf_id をローカルパスに変えるだけで同じ IF で比較できる。
